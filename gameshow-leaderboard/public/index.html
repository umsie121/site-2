<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Games Night Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Inline&family=Monoton&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="display.css" />
</head>
<body>
  <!-- ======= ambient stage ======= -->
  <div class="stage" aria-hidden="true">
    <div class="sky"></div>
    <div class="beam beam-l"></div>
    <div class="beam beam-r"></div>
    <div class="floor"><div class="grid"></div></div>
    <div class="lasers" id="lasers">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <canvas id="ambient"></canvas>
    <div class="beatflash" id="beatflash"></div>
    <div class="vignette"></div>
  </div>

  <!-- ======= HUD ======= -->
  <header class="hud">
    <div class="hud-left">
      <div class="live"><span class="dot"></span>LIVE</div>
      <div class="round" id="round">ROUND 1</div>
      <div class="game" id="game"></div>
    </div>
    <div class="hud-center">
      <h1 class="title" id="title" data-text="GAMES NIGHT">GAMES NIGHT</h1>
      <div class="subtitle" id="subtitle">THE ULTIMATE SHOWDOWN</div>
      <div class="timer" id="timer">
        <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44"/><circle class="prog" id="timerProg" cx="50" cy="50" r="44"/></svg>
        <div class="timer-digits" id="timerDigits">0:00</div>
        <div class="timer-label">TIME LEFT</div>
      </div>
    </div>
    <div class="hud-right">
      <div class="clock" id="clock">00:00</div>
      <div class="conn" id="conn"><span></span>CONNECTING</div>
      <div class="np" id="np"></div>
    </div>
  </header>

  <main class="board" id="board"></main>

  <footer class="ticker">
    <div class="ticker-label">LATEST</div>
    <div class="ticker-track"><div class="ticker-items" id="ticker"></div></div>
  </footer>

  <!-- ======= overlays ======= -->
  <canvas id="fx"></canvas>
  <div class="onair" id="onair">
    <div class="onair-badge"><span class="onair-dot"></span><span id="onairLabel">LIVE COMMENTARY</span></div>
    <div class="onair-text" id="onairText"></div>
    <canvas class="onair-viz" id="onairViz"></canvas>
  </div>
  <div class="takeover" id="takeover"><div class="takeover-inner"></div></div>
  <div class="flash" id="flash"></div>
  <div class="urgent-frame" id="urgent"></div>
  <div class="banner" id="banner"><div class="banner-bar"><div class="banner-text"></div></div></div>

  <div class="start" id="start">
    <div class="start-inner">
      <div class="start-logo">GAMES NIGHT</div>
      <button class="start-btn" id="startBtn">▶ GO LIVE</button>
      <div class="start-phone" id="startPhone" hidden>
        <div class="qr" id="qr"></div>
        <div><b>📱 Host control</b><span>Scan with your phone (same Wi-Fi)</span><code id="adminUrl"></code></div>
      </div>
      <div class="start-hint">Click to enable sound · <b>F</b> fullscreen · <b>M</b> music · <b>S</b> sound effects · <b>A</b> announcer</div>
    </div>
  </div>

  <div class="soundwarn" id="soundwarn" hidden>🔇 SOUND PAUSED BY THE BROWSER · CLICK ANYWHERE TO RESUME</div>

  <div class="dock" id="dock">
    <button data-act="music" id="btnMusic" title="Background music (M)">♫ MUSIC <b>OFF</b></button>
    <label class="vol" title="Music volume">VOL <input type="range" id="vol" min="0" max="100" value="45" /></label>
    <label class="vol" title="Background track">TRACK <select id="trackSel"></select></label>
    <button data-act="next" title="Next track (N)">⏭ NEXT</button>
    <button data-act="load" title="Add your own songs to a playlist">+ ADD MP3s</button>
    <button data-act="sfx" id="btnSfx" title="Sound effects (S)">SFX <b>ON</b></button>
    <button data-act="voice" id="btnVoice" title="Announcer voice (A)">🎙 ANNOUNCER <b>ON</b></button>
    <label class="vol" title="Announcer volume">VOICE <input type="range" id="voiceVol" min="0" max="150" value="100" /></label>
    <button data-act="testvoice" title="Test the announcer (V)">TEST VOICE</button>
    <button data-act="test" title="Demo animation (T)">TEST FX</button>
    <button data-act="full" title="Fullscreen (F)">⛶ FULLSCREEN</button>
    <input type="file" id="file" accept="audio/*" multiple hidden />
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="audio.js"></script>
  <script src="announcer.js"></script>
  <script src="display.js"></script>
</body>
</html>
